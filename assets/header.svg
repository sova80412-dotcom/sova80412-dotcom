<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi, I'm sovaaa — full-stack developer and night owl">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a1c"/><stop offset=".55" stop-color="#141038"/><stop offset="1" stop-color="#2c1764"/>
  </linearGradient>
  <radialGradient id="moonGlow"><stop offset="0" stop-color="#fde68a" stop-opacity=".35"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
  <radialGradient id="horizon" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="664" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#ffb347"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="owlBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a44a8"/><stop offset="1" stop-color="#2a1d5c"/></linearGradient>
  <radialGradient id="iris" cx=".4" cy=".4"><stop offset="0" stop-color="#ffe29a"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#f97316"/></radialGradient>
  <linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <mask id="crescent"><circle cx="1090" cy="66" r="30" fill="#fff"/><circle cx="1103" cy="57" r="27" fill="#000"/></mask>
  <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
  .st{fill:#fff;animation:tw ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .shoot{animation:shoot 9s ease-out infinite;opacity:0}
  @keyframes shoot{0%{transform:translate(180px,8px) rotate(22deg);opacity:0}2%{opacity:1}12%{transform:translate(620px,186px) rotate(22deg);opacity:0}100%{transform:translate(620px,186px) rotate(22deg);opacity:0}}
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
  .bob{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
  .pupil{animation:look 9s ease-in-out infinite}
  @keyframes look{0%,25%{transform:translate(0,0)}35%,50%{transform:translate(-4px,1px)}60%,78%{transform:translate(4px,1px)}88%,100%{transform:translate(0,0)}}
  .wave{transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.6s ease-in-out infinite}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
  .cur{animation:cur 1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}
  .glowpulse{animation:gp 3s ease-in-out infinite}
  @keyframes gp{0%,100%{opacity:.45}50%{opacity:.75}}
</style>
<g clip-path="url(#card)">
